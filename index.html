<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Ilha dos Cristais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: canvas 3D em tela cheia, HUD flutuando nos cantos com insets de safe-area */
:root{
  color-scheme: dark;
  --ink:#1d1630;
  --panel:#2a2145;
  --panel-2:#3a2f5e;
  --line:#5b4a8f;
  --text:#fff8ec;
  --muted:#c9bfe6;
  --coin:#ffcc33;
  --gem:#34f0b0;
  --hot:#ff6b35;
  --ok:#3ddc84;
  --bad:#ff5470;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--body);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
#stats{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ink) 78%,transparent);border:2px solid var(--line);border-radius:14px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.chip .ico{width:30px;height:30px;flex:none}
.chip b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px;line-height:1}
.chip small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#coins b{color:var(--coin)}
#coins.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.08)}}
.bar{width:150px;height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--gem);transition:width .15s}
#bag.full .bar i{background:var(--bad)}
#bag.full b{color:var(--bad)}
#mult{font-size:13px;font-weight:900;color:var(--hot);padding:4px 12px}
#mult[hidden],#petChip[hidden]{display:none!important}
#petChip{font-size:13px;font-weight:900;color:var(--gem);padding:4px 12px}
#topright{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.btn{font-family:var(--display);font-size:18px;letter-spacing:.5px;color:var(--text);background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn.go{background:var(--ok);border-color:#1f9e58;color:#0d2a1a}
.btn.buy{background:var(--coin);border-color:#c79a12;color:#3a2a00}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
#banner{top:22%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#banner small{display:block;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--muted)}
#banner b{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,64px);text-shadow:0 4px 0 rgba(0,0,0,.4);color:var(--text)}
#toast{bottom:calc(120px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:900;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#gate{bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px 10px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
#gate div{min-width:0}
#gate b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
#gate span{font-size:13px;color:var(--muted);font-weight:800}
#help{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));font-size:13px;font-weight:800;color:var(--muted);background:color-mix(in srgb,var(--ink) 70%,transparent);padding:8px 12px;border-radius:10px;transition:opacity 1s}
#help kbd{font-family:var(--body);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--text)}
body.touch #help{display:none}
#jump{display:none;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;font-size:16px;padding:0}
body.touch #jump{display:block}
#cross{position:fixed;left:50%;top:50%;z-index:4;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;display:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55);border-radius:2px}
#cross::before{left:10px;top:0;width:2px;height:22px}
#cross::after{top:10px;left:0;height:2px;width:22px}
body.shiftlock #cross{display:block}
#dive{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(ellipse at center,rgba(40,140,220,0) 45%,rgba(4,30,60,.75) 100%)}
body.under #dive{opacity:1}
#dive.flash{opacity:1;background:#0b4a78;transition:opacity .35s}
#talk{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100vw - 24px));background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.4);padding:14px 16px 10px;animation:talkIn .2s ease-out}
@keyframes talkIn{from{opacity:0;transform:translate(-50%,20px)}}
.talkhead{display:flex;align-items:center;gap:10px}
#talkFace{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--ink);border:2px solid rgba(0,0,0,.3);flex:none}
#talkName{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px}
#talkTxt{margin:8px 0 12px;font-size:17px;font-weight:800;line-height:1.4;min-height:2.8em}
.talkopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.talkopts .btn{font-size:16px;padding:9px 8px}
.btn.pet{background:#ff7ac8;border-color:#c4478f;color:#3a0b2a}
#talk small{display:block;margin-top:8px;text-align:right;font-size:11px;font-weight:800;color:var(--muted)}
body.touch #talk small{display:none}
@media (max-width:560px){.talkopts{grid-template-columns:repeat(2,1fr)}#talkTxt{font-size:15px}}
#talkBtn{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:18px;padding:10px 18px}
#stick{position:fixed;z-index:4;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);pointer-events:none;display:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
.float{position:fixed;z-index:6;pointer-events:none;font-family:var(--display);font-size:22px;color:var(--gem);text-shadow:0 2px 0 rgba(0,0,0,.6);animation:rise .9s ease-out forwards;transform:translate(-50%,-50%)}
.float.coin{color:var(--coin);font-size:30px}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
/* Loja */
#shop,#pets{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(10,6,24,.6);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 10px 0 rgba(0,0,0,.4);padding:18px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:.5px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:20px;margin:18px 0 8px;color:var(--hot)}
.up{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--panel-2);margin-top:8px}
.up .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--ink)}
.up div{min-width:0}
.up b{font-size:16px;font-weight:900}
.up p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:700}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:10px;height:6px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--gem)}
.up .btn{font-size:15px;padding:7px 10px;min-width:96px}
.reb{padding:12px;border-radius:14px;border:2px dashed var(--hot);font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.reb strong{color:var(--text)}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.egg{background:var(--panel-2);border-radius:14px;padding:10px 8px;text-align:center;display:grid;gap:6px;justify-items:center;align-content:start}
.egg .shape{width:42px;height:54px}
.shape{display:block;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;border:3px solid rgba(0,0,0,.3)}
.egg b{font-size:14px;font-weight:900}
.egg p{margin:0;font-size:11px;color:var(--muted);font-weight:700;line-height:1.4}
.egg .btn{font-size:15px;padding:6px 8px;width:100%;margin-top:auto}
.petbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.petbar h3{margin:0;font-size:18px}
.petbar .btn{font-size:14px;padding:6px 10px}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pet{background:var(--panel-2);border-radius:12px;padding:8px 10px;border:2px solid transparent;display:grid;gap:3px}
.pet.on{border-color:var(--gem)}
.pet b{font-size:15px;font-weight:900}
.pet small{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.pet span{font-size:13px;font-weight:800;color:var(--gem)}
.pet .row{display:flex;gap:6px;margin-top:4px}
.pet .btn{font-size:13px;padding:5px 6px;flex:1}
.empty{color:var(--muted);font-weight:700;font-size:14px;margin:4px 0}
#hatch{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(10,6,24,.85);text-align:center;padding:16px}
#hatch .shape{width:110px;height:140px;margin:0 auto;border-width:4px;animation:wob .16s ease-in-out infinite alternate}
#hatch.open .shape{display:none}
@keyframes wob{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#hatchRes{display:none}
#hatch.open #hatchRes{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#hatchRes small{display:block;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
#hatchRes b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,56px);text-shadow:0 4px 0 rgba(0,0,0,.4)}
#hatchRes p{font-weight:800;color:var(--gem);font-size:18px;margin:6px 0 16px}
@media (max-width:480px){.egg p{font-size:10px}.chip b{font-size:20px}.bar{width:110px}.btn{font-size:16px;padding:7px 11px}}
@media (prefers-reduced-motion:reduce){#hatch .shape{animation:none}.float{animation-duration:.01s}#coins.pulse{animation:none}}
</style>

<canvas id="game" tabindex="0" aria-label="Mundo do jogo"></canvas>

<div class="hud" id="stats">
  <div class="chip" id="coins">
    <svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="#ffcc33" stroke="#c79a12" stroke-width="3"/><path d="M15 8v14M11 11h6a2 2 0 010 4h-4a2 2 0 000 4h6" stroke="#8a6400" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <div><small>Moedas</small><b id="coinTxt">0</b></div>
  </div>
  <div class="chip" id="bag">
    <svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l9 9-9 15-9-15z" fill="#34f0b0" stroke="#108a63" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 12h18M15 3l-3 9 3 15 3-15z" stroke="#108a63" stroke-width="1.6" fill="none"/></svg>
    <div><small>Mochila</small><b id="bagTxt">0/10</b><div class="bar"><i id="bagBar"></i></div></div>
  </div>
  <div class="chip" id="mult" hidden>Renascimentos: <span id="multTxt"></span></div>
  <div class="chip" id="petChip" hidden>Pets: <span id="petTxt"></span></div>
</div>

<div class="hud" id="topright">
  <button class="btn" id="petsBtn" type="button">Pets</button>
  <button class="btn buy" id="shopBtn" type="button">Loja</button>
  <button class="btn" id="soundBtn" type="button" aria-pressed="true">Som: ligado</button>
</div>

<div class="hud" id="banner"><small id="bannerSub">Você entrou em</small><b id="bannerTxt"></b></div>
<div class="hud" id="toast" role="status"></div>
<div class="hud" id="gate" hidden>
  <div><b id="gateName"></b><span id="gateInfo"></span></div>
  <button class="btn go" id="gateBtn" type="button">Desbloquear</button>
</div>
<div class="hud" id="help"><kbd>W A S D</kbd> andar · <kbd>Espaço</kbd> pular · arraste o mouse para girar a câmera · <kbd>L</kbd> loja · <kbd>P</kbd> pets · <kbd>Shift</kbd> shift lock · <kbd>E</kbd> conversar</div>
<div id="cross" aria-hidden="true"></div>
<div id="dive" aria-hidden="true"></div>
<button class="btn go" id="talkBtn" type="button" hidden>Conversar</button>
<div id="talk" hidden role="dialog" aria-labelledby="talkName">
  <div class="talkhead"><span id="talkFace"></span><b id="talkName"></b></div>
  <p id="talkTxt" aria-live="polite"></p>
  <div class="talkopts">
    <button class="btn go" id="talkSell" type="button" data-act="sell">Vender cristais</button>
    <button class="btn buy" type="button" data-act="shop">Comprar melhorias</button>
    <button class="btn pet" type="button" data-act="pets">Pets</button>
    <button class="btn" type="button" data-act="bye">Tchau</button>
  </div>
  <small>Teclas 1 · 2 · 3 · 4</small>
</div>
<button class="hud btn go" id="jump" type="button">PULAR</button>
<div id="stick"><i></i></div>

<div id="shop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <header><h2 id="shopTitle">Loja de Melhorias</h2><button class="btn" id="closeShop" type="button">Fechar</button></header>
    <div id="ups"></div>
    <h3>Renascer</h3>
    <div class="reb"><span id="rebTxt"></span><button class="btn" id="rebBtn" type="button">Renascer</button></div>
  </div>
</div>

<div id="pets" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="petsTitle">
    <header><h2 id="petsTitle">Ovos e Pets</h2><button class="btn" id="closePets" type="button">Fechar</button></header>
    <div class="eggs" id="eggs"></div>
    <div class="petbar"><h3 id="petCount">Meus pets</h3><button class="btn go" id="bestBtn" type="button">Levar os melhores</button></div>
    <div class="petgrid" id="petList"></div>
  </div>
</div>
<div id="hatch" hidden><div><span class="shape" id="hatchEgg"></span><div id="hatchRes"><small id="hatchRar"></small><b id="hatchName"></b><p id="hatchBonus"></p><button class="btn go" id="hatchOk" type="button">Legal!</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
// ---------- Dados do mundo ----------
const ZONES = [
  {name:'Campo Verde',     cx:0,  cz:80,  r:34, ground:0x7cc94f, edge:0x4f9a35, beach:0xf3dfa2, gem:0x34f0b0, value:1,   price:0},
  {name:'Dunas Douradas',  cx:88, cz:80,  r:34, ground:0xf0cf7a, edge:0xc9a04c, beach:0xfbe9bd, gem:0xff8a2a, value:6,   price:150},
  {name:'Vale Gelado',     cx:88, cz:168, r:34, ground:0xeaf4ff, edge:0xa9c8ea, beach:0xcfe4f8, gem:0x4aa8ff, value:40,  price:2500},
  {name:'Cratera de Lava', cx:0,  cz:168, r:34, ground:0x4a3434, edge:0x2a1c1c, beach:0x2a1c1c, gem:0xff2f6d, value:300, price:40000},
  {name:'Reino Submerso',  cx:0,  cz:640, r:40, ground:0xd9c48f, edge:0xc4ad78, beach:0xb8a070, gem:0x9a6bff, value:2000, price:250000, sub:true},
];
const UPG = {
  bag:   {name:'Mochila maior',  color:'#b07cff', letter:'M', base:15, mult:2.35, max:12, eff:l=>`Carrega ${fmt(bagCap(l))} cristais`},

const RARITY = {c:{name:'Comum',color:'#c9bfe6'}, r:{name:'Raro',color:'#4aa8ff'}, e:{name:'Épico',color:'#b07cff'}, l:{name:'Lendário',color:'#ffcc33'}};
const PETS = {

  dragelo:  {name:'Dragão de Gelo',  rar:'l', bonus:2,   body:0x7fd0ff, acc:0xffffff, horns:1, wings:1, wingC:0xcfeeff, fly:1, tail:1},

};
const EGGS = [
  {name:'Ovo Comum',  price:120,    color:'#f4ecd8', pool:[['pinto',50],['coelho',30],['gato',15],['raposa',5]]},
  {name:'Ovo Gelado', price:5000,   color:'#9fd8ff', pool:[['pinguim',50],['panda',30],['coruja',16],['dragelo',4]]},
  {name:'Ovo de Lava',price:150000, color:'#ff6a3a', pool:[['unicornio',50],['golem',32],['fenix',14],['dourado',4]]},

let petObjs = [], petKey = null;
function syncPets(){
  const key = S.equip.map(id => id + ':' + (S.pets.find(p => p.id === id) || {}).k).join(',');
  if (key === petKey) return; petKey = key;
  const old = new Map(petObjs.map(o => [o.id, o]));
  petGroup.clear();
  petObjs = S.equip.map(id => {
    const p = S.pets.find(q => q.id === id); if (!p) return null;
    const prev = old.get(id), {g, wings} = buildPet(p.k);
    if (prev) g.position.copy(prev.g.position); else g.position.set(P.x, P.y, P.z - 1.5);
    petGroup.add(g);
    return {id, g, wings, fly: !!PETS[p.k].fly, y: prev ? prev.y : P.y};
  }).filter(Boolean);
}
function updatePets(dt, t){
  const n = petObjs.length;
  petObjs.forEach((o, i) => {
    const ang = player.rotation.y + Math.PI + (i - (n - 1) / 2) * 0.75, g = o.g;
    const tx = P.x + Math.sin(ang) * 2.3, tz = P.z + Math.cos(ang) * 2.3;
    if (Math.hypot(g.position.x - P.x, g.position.z - P.z) > 25){ g.position.set(tx, P.y, tz); o.y = P.y; }
    const k = Math.min(1, dt * 7), vx = (tx - g.position.x) * k, vz = (tz - g.position.z) * k;
    g.position.x += vx; g.position.z += vz;
    const sp = Math.hypot(vx, vz) / Math.max(dt, 1e-4);
    o.y += ((o.fly ? P.y + 1.2 : P.y) - o.y) * Math.min(1, dt * 8);
    g.position.y = o.y + (o.fly ? Math.sin(t * 3 + i) * 0.2 : (sp > 1 ? Math.abs(Math.sin(t * 12 + i)) * 0.3 : 0));
    const want = sp > 0.6 ? Math.atan2(vx, vz) : Math.atan2(P.x - g.position.x, P.z - g.position.z);
    let a = want - g.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a)); g.rotation.y += a * Math.min(1, dt * 10);
    o.wings.forEach(w => { w.p.rotation.z = w.s * (0.2 + Math.sin(t * (o.fly ? 12 : 18) + i) * 0.5); });
  });
}

function floatText(txt, x, y, z, cls = ''){
  v3.set(x, y, z).project(camera);
  if (v3.z > 1) return;
  const el = document.createElement('div'); el.className = 'float ' + cls; el.textContent = txt;
  el.style.left = (v3.x * .5 + .5) * innerWidth + 'px'; el.style.top = (-v3.y * .5 + .5) * innerHeight + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 950);
}
function pulseCoins(){ const c = $('coins'); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }

// Portões
function updateGates(){
  ZONES.forEach((Z, i) => { if (gateMeshes[i]) gateMeshes[i].forEach(m => m.visible = i >= S.unlocked); });
}
const gateEl = $('gate');
function gateCheck(){
  const i = S.unlocked;
  const near = i < ZONES.length && (ZONES[i].gate ? Math.hypot(P.x - ZONES[i].gate.x, P.z - ZONES[i].gate.z) < 16 : inIsle(ZONES[i], P.x, P.z, 10));
  if (near){
    const Z = ZONES[i];
    $('gateName').textContent = Z.name;
    $('gateInfo').textContent = `Custa ${fmt(Z.price)} moedas · cristais valem ${fmt(Z.value * gemMult())} cada`;
    $('gateBtn').disabled = S.coins < Z.price;
    $('gateBtn').textContent = S.coins < Z.price ? `Faltam ${fmt(Z.price - S.coins)}` : 'Desbloquear';
  }
  gateEl.hidden = !near;
}
$('gateBtn').addEventListener('click', () => {
  const Z = ZONES[S.unlocked]; if (!Z || S.coins < Z.price) return;
  S.coins -= Z.price; S.unlocked++; save(); hud(); gateCheck();
  beep(440, .12, 'triangle', .08, 2); setTimeout(() => beep(660, .2, 'triangle', .08, 2), 120);
  banner(Z.name, 'Desbloqueado!'); canvas.focus();
});

// Loja
const shopEl = $('shop'), petsEl = $('pets');
function toggleShop(force){
  const open = force === undefined ? shopEl.hidden : force;
  shopEl.hidden = !open;
  if (open){ if (shiftLock) setShiftLock(false); petsEl.hidden = true; renderShop(); $('closeShop').focus(); } else canvas.focus();
}
function costOf(k){ return Math.round(UPG[k].base * Math.pow(UPG[k].mult, S.lv[k])); }
function renderShop(){
  $('ups').innerHTML = Object.entries(UPG).map(([k, u]) => {
    const l = S.lv[k], maxed = l >= u.max, c = costOf(k);
    const bars = Array.from({length:u.max}, (_, j) => `<i class="${j < l ? 'on' : ''}"></i>`).join('');
    return `<div class="up"><span class="ico" style="background:${u.color}">${u.letter}</span>
      <div><b>${u.name}</b><p>${u.eff(l)}${maxed ? '' : ' → ' + u.eff(l+1).replace(/^\D+/, '')}</p><div class="lv">${bars}</div></div>
      <button class="btn buy" type="button" data-k="${k}" ${maxed || S.coins < c ? 'disabled' : ''}>${maxed ? 'Máximo' : fmt(c)}</button></div>`;
  }).join('');
  const rc = rebirthCost(S.rebirths), canR = S.coins >= rc && S.unlocked >= ZONES.length;
  $('rebTxt').innerHTML = `Recomece do zero com cristais valendo <strong>${multOf(S.rebirths+1)}x</strong>. Precisa abrir todas as áreas e ter <strong>${fmt(rc)}</strong> moedas. Seus pets ficam com você.`;
  $('rebBtn').disabled = !canR;
}
$('ups').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k, c = costOf(k);
  if (S.coins < c || S.lv[k] >= UPG[k].max) return;
  S.coins -= c; S.lv[k]++; save(); hud(); beep(520, .12, 'square', .05, 1.6);
  toast(`${UPG[k].name}: nível ${S.lv[k]}`);
});
$('rebBtn').addEventListener('click', () => {
  if (S.coins < rebirthCost(S.rebirths) || S.unlocked < ZONES.length) return;
  const r = S.rebirths + 1, keep = {pets:S.pets, equip:S.equip, nid:S.nid}; S = fresh(); Object.assign(S, keep); S.rebirths = r; save();
  Object.assign(P, {x:0, y:0, z:8, vy:0}); toggleShop(false); hud();
  banner(`Cristais valem ${multOf(r)}x`, 'Você renasceu!'); beep(330, .4, 'triangle', .09, 3);
});
$('shopBtn').addEventListener('click', () => { initAudio(); toggleShop(); });
$('closeShop').addEventListener('click', () => toggleShop(false));
shopEl.addEventListener('pointerdown', e => { if (e.target === shopEl) toggleShop(false); });

// Ovos e pets
function togglePets(force){
  const open = force === undefined ? petsEl.hidden : force;
  if (open === !petsEl.hidden) return;
  petsEl.hidden = !open;
  if (open){ if (shiftLock) setShiftLock(false); shopEl.hidden = true; renderPets(); $('closePets').focus(); } else canvas.focus();
}
function renderPets(){
  const full = S.pets.length >= PET_MAX;
  $('eggs').innerHTML = EGGS.map((e, i) => {
    const tot = e.pool.reduce((a, p) => a + p[1], 0);
    const odds = e.pool.map(([k, w]) => `${PETS[k].name} ${Math.round(w / tot * 100)}%`).join('<br>');
    return `<div class="egg"><span class="shape" style="background:${e.color}"></span><b>${e.name}</b><p>${odds}</p>
      <button class="btn buy" type="button" data-egg="${i}" ${S.coins < e.price || full ? 'disabled' : ''}>${fmt(e.price)}</button></div>`;
  }).join('');
  const sorted = [...S.pets].sort((a, b) => (S.equip.includes(b.id) - S.equip.includes(a.id)) || (PETS[b.k].bonus - PETS[a.k].bonus));
  $('petCount').textContent = `Meus pets: ${S.pets.length}/${PET_MAX} · levando ${S.equip.length}/${PET_SLOTS}`;
  $('petList').innerHTML = sorted.length ? sorted.map(p => {
    const d = PETS[p.k], on = S.equip.includes(p.id), R = RARITY[d.rar];
    return `<div class="pet ${on ? 'on' : ''}"><small style="color:${R.color}">${R.name}</small><b>${d.name}</b><span>+${pct(d.bonus)} cristais</span>
      <div class="row"><button class="btn ${on ? '' : 'go'}" type="button" data-eq="${p.id}">${on ? 'Guardar' : 'Levar'}</button>${on ? '' : `<button class="btn" type="button" data-rel="${p.id}">Soltar</button>`}</div></div>`;
  }).join('') : '<p class="empty">Você ainda não tem pets. Compre um ovo!</p>';
  $('bestBtn').disabled = !S.pets.length;
}
let hatching = false;
function hatchEgg(i){
  const e = EGGS[i];
  if (hatching || S.coins < e.price) return;
  if (S.pets.length >= PET_MAX){ toast('Pets demais! Solte alguns primeiro.'); return; }
  const tot = e.pool.reduce((a, p) => a + p[1], 0);
  let r = Math.random() * tot, k = e.pool[0][0];
  for (const [pk, w] of e.pool){ if ((r -= w) < 0){ k = pk; break; } }
  S.coins -= e.price;
  const id = S.nid++; S.pets.push({id, k});
  if (S.equip.length < PET_SLOTS) S.equip.push(id);
  save(); hud(); pulseCoins();
  hatching = true;
  const d = PETS[k], R = RARITY[d.rar], h = $('hatch');
  $('hatchEgg').style.background = e.color;
  $('hatchRar').textContent = R.name; $('hatchRar').style.color = R.color;
  $('hatchName').textContent = d.name; $('hatchName').style.color = R.color;
  $('hatchBonus').textContent = `+${pct(d.bonus)} no valor dos cristais` + (S.equip.includes(id) ? '' : ' (guardado na lista)');
  h.classList.remove('open'); h.hidden = false;
  [0, 300, 600, 900].forEach(ms => setTimeout(() => beep(200 + ms / 4, .06, 'square', .04, 1.2), ms));
  setTimeout(() => {
    h.classList.add('open'); $('hatchOk').focus();
    const notes = {c:[523], r:[523, 659], e:[523, 659, 784], l:[523, 659, 784, 1047]}[d.rar];
    notes.forEach((f, j) => setTimeout(() => beep(f, .18, 'triangle', .08, 1.3), j * 110));
  }, 1300);
}
$('hatchOk').addEventListener('click', () => { $('hatch').hidden = true; hatching = false; renderPets(); $('closePets').focus(); });
$('eggs').addEventListener('click', e => { const b = e.target.closest('button[data-egg]'); if (b) hatchEgg(+b.dataset.egg); });
$('petList').addEventListener('click', e => {
  const eq = e.target.closest('button[data-eq]'), rel = e.target.closest('button[data-rel]');
  if (eq){
    const id = +eq.dataset.eq;
    if (S.equip.includes(id)) S.equip = S.equip.filter(x => x !== id);
    else if (S.equip.length >= PET_SLOTS){ toast(`Você só pode levar ${PET_SLOTS} pets. Guarde um primeiro.`); return; }
    else S.equip.push(id);
    save(); hud(); beep(600, .07, 'sine', .05, 1.3);
  }
  if (rel){
    if (!rel.dataset.sure){ rel.dataset.sure = '1'; rel.textContent = 'Certeza?'; return; }
    const id = +rel.dataset.rel; S.pets = S.pets.filter(p => p.id !== id); save(); hud();
  }
});
$('bestBtn').addEventListener('click', () => {
  S.equip = [...S.pets].sort((a, b) => PETS[b.k].bonus - PETS[a.k].bonus).slice(0, PET_SLOTS).map(p => p.id);
  save(); hud(); toast('Melhores pets com você!');
});
$('petsBtn').addEventListener('click', () => { initAudio(); togglePets(); });
$('closePets').addEventListener('click', () => togglePets(false));
petsEl.addEventListener('pointerdown', e => { if (e.target === petsEl) togglePets(false); });

// Conversa com o vendedor da barraca
const talkEl = $('talk'), talkBtn = $('talkBtn');
let talkStall = null, nearStall = null, typeT = 0;
function say(txt){
  const el = $('talkTxt'); clearInterval(typeT);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = txt; return; }
  let i = 0; el.textContent = '';
  typeT = setInterval(() => {
    i += 2; el.textContent = txt.slice(0, i);
    if (i % 6 === 0) beep(380 + Math.random() * 160, .03, 'square', .02, 1.1);
    if (i >= txt.length) clearInterval(typeT);
  }, 22);
}
function openTalk(st){
  if (!shopEl.hidden || !petsEl.hidden || !$('hatch').hidden) return;
  if (shiftLock) setShiftLock(false);
  talkStall = st;
  $('talkName').textContent = st.N.name;
  $('talkFace').style.background = st.N.css;
  $('talkFace').textContent = st.N.name.split(' ').pop()[0];
  $('talkSell').textContent = S.bag > 0 ? `Vender cristais (${fmt(S.bag)})` : 'Vender cristais';
  talkEl.hidden = false;
  say(st.N.hello);
  $('talkSell').focus();
}
function closeTalk(){ if (talkEl.hidden) return; clearInterval(typeT); talkEl.hidden = true; canvas.focus(); }
function talkAct(act){
  if (act === 'sell'){
    if (S.bag > 0){
      const v = S.bagVal, n = S.bag; S.coins += v; S.bag = 0; S.bagVal = 0; save(); hud(); pulseCoins();
      floatText('+' + fmt(v), P.x, P.y + 3.4, P.z, 'coin');
      beep(660, .08, 'triangle', .07, 1.3); setTimeout(() => beep(990, .14, 'triangle', .07, 1.3), 90);
      $('talkSell').textContent = 'Vender cristais';
      say(`Negócio fechado! ${fmt(n)} cristais por ${fmt(v)} moedas. Quer mais alguma coisa?`);
    } else say('Hmm, sua mochila está vazia! Vá pegar uns cristais e volte aqui.');
  }
  if (act === 'shop'){ closeTalk(); toggleShop(true); }
  if (act === 'pets'){ closeTalk(); togglePets(true); }
  if (act === 'bye'){ closeTalk(); toast(`${talkStall.N.name}: Até mais!`); }
}
talkEl.addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b){ initAudio(); talkAct(b.dataset.act); } });
talkBtn.addEventListener('click', () => { initAudio(); if (nearStall) openTalk(nearStall); });

// ---------- Laço do jogo ----------
let last = performance.now(), saveT = 0, fullWarn = 0, combo = 0, comboT = 0, zoneNow = -1, gemSoundT = 0;
function step(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  // movimento
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (stick.id !== null){ ix += stick.x; iz -= stick.y; }
  const mag = Math.min(1, Math.hypot(ix, iz));
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  let mx = 0, mz = 0;
  if (mag > 0.08 && shopEl.hidden && petsEl.hidden && talkEl.hidden){
    const n = Math.hypot(ix, iz);
    const dx = (fx * iz + -fz * ix) / n, dz = (fz * iz + fx * ix) / n;
    const sp = speedOf(S.lv.speed) * mag;
    mx = dx * sp * dt; mz = dz * sp * dt;
    P.face = Math.atan2(dx, dz);
  }
  if (shiftLock) P.face = Math.atan2(fx, fz);
  // x
  let nx = P.x + mx, c = blocked(nx, P.z, P.y);
  if (c) nx = mx > 0 ? c.minX - RAD - 0.001 : c.maxX + RAD + 0.001;
  if (!blocked(nx, P.z, P.y) && !lockedAt(nx, P.z)) P.x = nx;
  let nz = P.z + mz; c = blocked(P.x, nz, P.y);
  if (c) nz = mz > 0 ? c.minZ - RAD - 0.001 : c.maxZ + RAD + 0.001;
  if (!blocked(P.x, nz, P.y) && !lockedAt(P.x, nz)) P.z = nz;
  // y
  coyote = P.onGround ? 0.1 : coyote - dt;
  if (jumpBuf > 0 && coyote > 0){ P.vy = jumpVel(S.lv.jump) * (under ? .7 : 1); P.onGround = false; coyote = 0; jumpBuf = 0; beep(300, .1, 'sine', .04, 2); }
  jumpBuf = Math.max(0, jumpBuf - dt);
  const prevY = P.y;
  P.vy = Math.max(under ? -10 : -40, P.vy - GRAV * (under ? .4 : 1) * dt);
  P.y += P.vy * dt;
  const sup = support(P.x, P.z, Math.max(prevY + 0.05, P.onGround ? P.y + STEP : P.y + 0.05));
  if (P.y <= sup && P.vy <= 0){ P.y = sup; P.vy = 0; P.onGround = true; } else if (P.y > sup + 0.05) P.onGround = false;
  if (SUB && !under && !diving && S.unlocked > SUB_I && P.y < -0.2 && Math.hypot(P.x - SUB.gate.x, P.z - SUB.gate.z) < 6) dive(true);
  if (under && !diving && Math.hypot(P.x - SUB.portal.x, P.z - SUB.portal.z) < 2) dive(false);
  if (P.y < -1.8 && !diving) splash();

  // boneco
  player.position.set(P.x, P.y, P.z);
  let da = P.face - player.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
  player.rotation.y += da * Math.min(1, dt * 14);
  const moving = mag > 0.08 && P.onGround;
  P.walk += dt * (moving ? speedOf(S.lv.speed) * 1.3 : 0);
  const sw = moving ? Math.sin(P.walk) * 0.8 : (P.onGround ? 0 : -0.5);
  limbs.armL.rotation.x = sw; limbs.armR.rotation.x = P.onGround ? -sw : -2.6;
  limbs.legL.rotation.x = -sw * (P.onGround ? 1 : 0.4); limbs.legR.rotation.x = sw * (P.onGround ? 1 : -0.4);
  if (!moving && P.onGround){ limbs.armL.rotation.x *= 0.8; }
  packGem.rotation.y += dt * 3;
  updatePets(dt, t);

  // câmera
  shoulder += ((shiftLock ? 1.7 : 0) - shoulder) * Math.min(1, dt * 10);
  const tx = P.x - fz * shoulder, ty = P.y + 2, tz = P.z + fx * shoulder;
  camera.position.set(tx + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, ty + Math.sin(cam.pitch) * cam.dist, tz + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(tx, ty, tz);
  sun.position.set(P.x + 18, 40, P.z - 12); sun.target.position.set(P.x, 0, P.z);

  // zona atual
  const zi = islandAt(P.x, P.z);
  if (zi !== null){
    lastIsland = zi;
    if (zi !== zoneNow){ zoneNow = zi; banner(zi < 0 ? 'Ilha Central' : (ZONES[zi].sub ? '' : 'Ilha ') + ZONES[zi].name, zi < 0 ? 'Voltou para a' : ZONES[zi].sub ? 'Você mergulhou no' : 'Você chegou na'); if (zi >= 0) packGem.material = gemMats[zi]; }
  }
  water.position.y = -0.5 + Math.sin(t * 0.9) * 0.05;
  for (const f of foams) f.material.opacity = 0.35 + Math.sin(t * 1.6) * 0.12;
  for (const w of whirls) w.m.rotation.y -= dt * w.sp;
  if (under){
    realmFx.surf.material.opacity = .45 + Math.sin(t * 1.3) * .08;
    realmFx.rays.forEach((r, k) => r.material.opacity = .05 + Math.sin(t * .8 + k) * .03);
    bubbleT -= dt;
    if (bubbleT <= 0){
      bubbleT = .09;
      if (Math.random() < .5) spawnBubble(P.x + (Math.random() - .5) * .6, P.y + 2.5, P.z + (Math.random() - .5) * .6);
      const a = Math.random() * 6.28; spawnBubble(SUB.portal.x + Math.cos(a) * 1.6, .3, SUB.portal.z + Math.sin(a) * 1.6);
    }
  }
  for (const b of bubbles) if (b.life > 0){
    b.life -= dt; b.m.position.y += dt * 2.4; b.m.position.x += Math.sin(t * 4 + b.ph) * dt * .5;
    if (b.life <= 0 || !under) { b.life = 0; b.m.visible = false; }
  }
  for (const b of bobbers){
    if (b.fish){ const a = t * b.sp + b.ph; b.fish.position.set(b.x + Math.cos(a) * b.r, b.y + Math.sin(t * .7 + b.ph) * .6, b.z + Math.sin(a) * b.r); b.fish.rotation.y = Math.atan2(-Math.sin(a) * b.sp, Math.cos(a) * b.sp); continue; }
    if (b.sway){ b.sway.rotation.z = Math.sin(t * 1.3 + b.ph) * .15; b.sway.rotation.x = Math.sin(t * 1.1 + b.ph * 2) * .1; continue; }
    if (b.spin) b.m.rotation.z += dt * b.spin;
    else if (b.smoke) b.smoke.forEach((s, k) => { const p = (t * .25 + k / b.smoke.length) % 1; s.position.set(b.x + Math.sin(k * 2 + t * .3) * p * 2, b.y + p * 8, b.z); s.scale.setScalar(.6 + p * 1.6); s.material.opacity = .6 * (1 - p); });
    else if (b.glow) b.glow.material.color.setHSL(.13, 1, .62 + Math.sin(t * 3) * .12);
    else if (b.spout) b.spout.position.y = b.y + Math.sin(t * 5) * .15;
    else { b.m.position.y = b.base + Math.sin(t * 1.5 + b.ph) * (b.amp || .12); if (b.rock) b.m.rotation.z = Math.sin(t * 1.1 + b.ph) * .06; }
  }

  // cristais
  const cap = bagCap(S.lv.bag), mag2 = magnetOf(S.lv.magnet), mult = gemMult();
  if (now > comboT) combo = 0;
  for (const g of gems){
    if (!g.active){ if (now > g.respawnAt) placeGem(g); continue; }
    if (Math.abs(g.z - P.z) > 80 || Math.abs(g.x - P.x) > 80) continue;
    const m = g.mesh;
    m.rotation.y += dt * 2.2;
    const dx = P.x - m.position.x, dy = (P.y + 1.3) - m.position.y, dz = P.z - m.position.z;
    const d = Math.hypot(dx, dy, dz);
    if (!g.flying){
      m.position.y = g.baseY + Math.sin(t * 2.4 + g.phase) * 0.18;
      if (d < mag2 + 0.6){
        if (S.bag < cap) g.flying = true;
        else if (now > fullWarn){ fullWarn = now + 2500; toast('Mochila cheia! Fale com o vendedor da barraca desta ilha'); beep(160, .15, 'square', .04, .7); }
      }
    } else {
      const k = Math.min(1, dt * 14);
      m.position.x += dx * k; m.position.y += dy * k; m.position.z += dz * k;
      m.scale.multiplyScalar(0.94);
      if (d < 0.6){
        g.active = false; m.visible = false; g.respawnAt = now + 3500 + Math.random() * 3000;
        const val = ZONES[g.zone].value * (g.golden ? 10 : 1) * mult;
        S.bag++; S.bagVal += val;
        combo++; comboT = now + 900;
        if (now > gemSoundT){ beep(g.golden ? 880 : 520 + Math.min(combo, 14) * 40, .07, 'sine', .06, 1.4); gemSoundT = now + 40; }
        floatText('+' + fmt(val), P.x, P.y + 3.1, P.z, g.golden ? 'coin' : '');
        hud();
      }
    }
  }

  // barracas
  nearStall = null;
  for (const st of stalls){
    const d = Math.hypot(P.x - st.tx, P.z - st.tz), on = d < 2.6 && P.y < 1.5;
    if (on) nearStall = st;
    if (on && !st.inside) openTalk(st);
    st.inside = on;
    if (Math.abs(st.g.position.x - P.x) > 70 || Math.abs(st.g.position.z - P.z) > 70) continue;
    const close = d < 9;
    st.npc.position.y = Math.sin(t * 2 + st.ph) * .03;
    // vira a cabeça para o jogador
    const lp = st.g.worldToLocal(v3.set(P.x, 0, P.z)), want = close ? Math.max(-1, Math.min(1, Math.atan2(lp.x, lp.z + 1.25))) : Math.sin(t * .5 + st.ph) * .3;
    st.head.rotation.y += (want - st.head.rotation.y) * Math.min(1, dt * 5);
    st.arms[1].rotation.x = close && talkStall !== st ? -2.7 : -1.1;
    st.arms[1].rotation.z = close && talkStall !== st ? Math.sin(t * 9) * .35 - .2 : 0;
  }
  if (!nearStall && !talkEl.hidden) closeTalk();
  if (talkEl.hidden) talkStall = null;
  talkBtn.hidden = !nearStall || !talkEl.hidden || !shopEl.hidden || !petsEl.hidden;

  gateCheck();
  if (now > saveT){ saveT = now + 3000; save(); }
  renderer.render(scene, camera);
  requestAnimationFrame(step);
}

function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

function start(data){
  if (data && data.S) merge(data.S); else load();
  if (data && data.P) Object.assign(P, data.P);
  if (!landAt(P.x, P.z) || lockedAt(P.x, P.z)) Object.assign(P, {x:0, y:0, z:8});
  if (SUB && inIsle(SUB, P.x, P.z)) setUnder(true);
  resize(); hud();
  cloudInit();
  setTimeout(() => { const h = $('help'); h.style.opacity = '0'; setTimeout(() => h.hidden = true, 1000); }, 12000);
  if (S.coins === 0 && S.bag === 0 && S.rebirths === 0) setTimeout(() => toast('Pegue cristais e venda para o vendedor da barraca', 3500), 1900);
  requestAnimationFrame(t => { last = t; step(t); });
}
window.claude?.hot?.snapshot?.(() => ({S, P:{x:P.x, y:P.y, z:P.z}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
